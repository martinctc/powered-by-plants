<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Blog posts about my Veganuary journey - reviews, experiences, and personal awards.">
  <title>Blog | Powered by Plants</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .blog-post {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }
    .blog-post h1 {
      color: var(--color-coral);
      margin-bottom: 1rem;
      font-size: 2.5rem;
    }
    .blog-date {
      color: #666;
      font-style: italic;
      margin-bottom: 2rem;
    }
    .blog-content {
      line-height: 1.8;
      font-size: 1.1rem;
    }
    .blog-content h1 {
      color: var(--color-coral);
      margin-bottom: 0.5rem;
      font-size: 2.5rem;
    }
    .blog-content strong {
      color: #666;
      font-style: italic;
      font-weight: normal;
      display: block;
      margin-bottom: 2rem;
    }
    .blog-content h2 {
      color: var(--color-dark-green);
      margin-top: 2.5rem;
      margin-bottom: 1rem;
      font-size: 1.8rem;
    }
    .blog-content p {
      margin-bottom: 1.5rem;
    }
    .blog-content ol, .blog-content ul {
      margin: 1.5rem 0;
      padding-left: 2rem;
    }
    .blog-content li {
      margin-bottom: 0.8rem;
    }
    .blog-content a {
      color: var(--color-coral);
      text-decoration: none;
      border-bottom: 1px solid var(--color-coral);
    }
    .blog-content a:hover {
      color: var(--color-dark-green);
      border-bottom-color: var(--color-dark-green);
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">Powered <span>by Plants</span> 🌱</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="why-vegan.html">Why Vegan?</a></li>
        <li><a href="recipes.html">Recipes</a></li>
        <li><a href="tips.html">Tips</a></li>
        <li><a href="restaurants.html">Restaurants</a></li>
        <li><a href="blog.html" class="active">Blog</a></li>
      </ul>
      <div class="menu-toggle" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </nav>

  <!-- Blog Post -->
  <section class="section section-white">
    <div class="blog-post">
      <div id="blog-content" class="blog-content">
        <!-- Blog post will be loaded here from Markdown -->
        <p style="text-align: center; padding: 2rem;">Loading blog post...</p>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 Powered by Plants. Let's make this January count! 🌱</p>
    </div>
  </footer>

  <!-- JavaScript for Mobile Menu -->
  <script>
    function toggleMenu() {
      document.querySelector('.nav-links').classList.toggle('active');
    }

    // Close menu when clicking a link
    document.querySelectorAll('.nav-links a').forEach(link => {
      link.addEventListener('click', () => {
        document.querySelector('.nav-links').classList.remove('active');
      });
    });
  </script>

  <!-- Marked.js for Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="js/blog-posts.js"></script>
  <script>
    // Get blog post ID from URL parameter, default to latest post
    const urlParams = new URLSearchParams(window.location.search);
    const postId = urlParams.get('post') || blogPosts[0].id;
    
    // Find the post
    const post = blogPosts.find(p => p.id === postId) || blogPosts[0];
    
    // Update page title
    document.title = `${post.title} | Powered by Plants`;
    
    // Load and render the markdown file
    fetch(post.file)
      .then(response => response.text())
      .then(markdown => {
        // Parse markdown to HTML
        const html = marked.parse(markdown);
        
        // Insert into page
        document.getElementById('blog-content').innerHTML = html;
      })
      .catch(error => {
        console.error('Error loading blog post:', error);
        document.getElementById('blog-content').innerHTML = 
          '<p style="color: red;">Error loading blog post. Please try again.</p>';
      });
  </script>
</body>
</html>
